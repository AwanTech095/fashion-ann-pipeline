stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - requirements.txt
    outs:
      - data/raw

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - requirements.txt
      - data/raw
    params:
      - preprocess.test_size
      - preprocess.seed
    outs:
      - data/processed

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - requirements.txt
      - data/processed
    params:
      - train.dense_units
      - train.dropout_rate
      - train.learning_rate
      - train.epochs
      - train.batch_size
      - train.seed
    outs:
      - models

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - requirements.txt
      - data/processed
      - models
    params:
      - train.batch_size
    metrics:
      - metrics.json:
          cache: false
    outs:
      - reports/confusion_matrix.png